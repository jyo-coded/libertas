<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libertas Live</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#262d36; --text:#d8dde3; --muted:#8b949e;
          --crit:#ff5c5c; --high:#ff9f43; --med:#f6c344; --low:#6fa8dc; --ok:#4cc38a; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, Segoe UI, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  header b { letter-spacing:.2em; color:#e8b04a; }
  .pill { padding:2px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .green { color:var(--ok); border-color:var(--ok); } .red { color:var(--crit); border-color:var(--crit); }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 12px; cursor:pointer; }
  button.danger { border-color:var(--crit); color:var(--crit); }
  main { display:grid; grid-template-columns: minmax(0,2fr) minmax(0,1fr); gap:16px; padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
  h3 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td, th { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:top; overflow-wrap:anywhere; }
  .alert { border-left:4px solid var(--low); background:#11161d; padding:8px 10px; margin-bottom:10px; border-radius:4px; }
  .sev-CRITICAL { border-color:var(--crit); } .sev-HIGH { border-color:var(--high); } .sev-MEDIUM { border-color:var(--med); }
  .alert .title { font-weight:600; } .alert .meta { color:var(--muted); font-size:12px; margin:3px 0; }
  .alert ul { margin:4px 0 0 18px; padding:0; font-size:12px; color:#b7c0ca; }
  .alert.gone { opacity:.85; background:repeating-linear-gradient(135deg,#11161d,#11161d 10px,#15191f 10px,#15191f 20px); }
  .badge { font-size:11px; padding:1px 6px; border-radius:4px; background:#2a1f12; color:var(--high); margin-left:6px; }
  .hist { opacity:.65; }
  #events div { font-family:Consolas, monospace; font-size:12px; border-bottom:1px solid var(--line); padding:3px 0; }
  .sim { background:#3b1414; color:#ffd2d2; text-align:center; font-size:12px; padding:4px; }
</style>
</head>
<body>
<div class="sim">ShadowNet SIMULATION: every organisation, person and identifier shown here is fictional.</div>
<header>
  <b>LIBERTAS</b>
  <span id="mode" class="pill"></span>
  <span id="kill" class="pill"></span>
  <span id="ttd" class="pill"></span>
  <span id="counts" class="pill"></span>
  <button id="killbtn" class="danger">Kill switch</button>
  <button id="resumebtn">Resume</button>
</header>
<main>
  <section>
    <h3>Alerts (live first, then historical backfill)</h3>
    <div id="alerts"></div>
  </section>
  <div>
    <section>
      <h3>Sources · Aquila watch sessions · Pulsus descriptors</h3>
      <table id="sources"></table>
    </section>
    <section style="margin-top:16px">
      <h3>Event stream</h3>
      <div id="events"></div>
    </section>
  </div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
